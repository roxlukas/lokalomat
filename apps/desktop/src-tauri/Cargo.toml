[package]
name = "studio-lokalsi"
description = "Lokalomat AI Studio – local AI studio (desktop shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "studio_lokalsi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
lokalsi-core.workspace = true
lokalsi-hwprobe.workspace = true
lokalsi-engines.workspace = true
lokalsi-api-gateway = { workspace = true, features = ["server"] }
tokio-util.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile.workspace = true
