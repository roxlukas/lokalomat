[package]
name = "lokalomat-mobile"
description = "Lokalomat AI Studio – Android client: uses the paired computer's modes (M5, V9)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lokalomat_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
base64.workspace = true
lokalsi-api-gateway = { workspace = true, features = ["client"] }
# Models that run on the phone itself: catalog, download, storage.
lokalsi-phone-models.workspace = true
tokio-util.workspace = true
# "Zapisz" on a result: the system save picker and writing to the picked file (ADR 0027).
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
# "Zgłoś" on an AI answer opens the mail app (mailto:, ADR 0040).
tauri-plugin-opener = "2.7.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"

[target.'cfg(target_os = "android")'.dependencies]
# Chat model on the phone itself (LiteRT-LM, docs/plans/android-local-chat.md).
tauri-plugin-localllm = { path = "../../../crates/tauri-plugin-localllm" }
# Already in the tree through tauri/wry; used to read the device name.
jni = "0.21.1"
ndk-context = "0.1.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring.workspace = true

[dev-dependencies]
tempfile.workspace = true
