[package]
name = "lokalsi-phone-models"
description = "Lokalomat AI Studio: models that run on the phone itself – catalog, download, storage (docs/plans/android-local-chat.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately without lokalsi-core: no database or credential store in the phone build.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# TLS without OpenSSL (not buildable for Android): rustls with the ring provider and the
# bundled Mozilla roots. The workspace reqwest uses native-tls, which pulls in openssl-sys.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
sha2.workspace = true
hex.workspace = true
webpki-roots = "1.0.12"
rustls.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
